<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logoCar.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RentCars — book a rental car in minutes. Browse the fleet, pick your dates and drive away."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <link rel="preload" href="/car.webp" as="image" />

    <title>RentCars — Car Rental Made Easy</title>

    <!--
      Set the theme before first paint. Without this the page renders light
      for a frame and then flips to dark once React mounts.
      Keep the default here in sync with readStoredTheme() in Context.jsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored ? stored === "dark" : true) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
